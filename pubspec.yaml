name: care_bridge
description: "BridgeCare — accessibility-first care support for independent living."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  google_fonts: ^6.2.1
  supabase_flutter: ^2.12.2
  gotrue: ^2.19.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.3
  font_awesome_flutter: ^11.0.0
  cupertino_icons: ^1.0.8
  country_code_picker: ^3.4.1
  intl: ^0.20.2
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  record: ^6.2.0
  audioplayers: ^6.5.1
  path_provider: ^2.1.5
  health: ^13.3.1
  flutter_local_notifications: ^21.0.0
  file_picker: ^8.1.4
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.jpeg
    - assets/bridgecare_logo.png